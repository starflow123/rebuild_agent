# 手术式重构 Agent 配置
spring:
  application:
    name: rebuild-agent
  main:
    # 关闭 banner 以保持 CLI 输出整洁
    banner-mode: off
    # 允许循环引用（部分工具服务相互引用）
    allow-circular-references: true

# 重构 Agent 配置
rebuild:
  # LLM 配置（支持所有 OpenAI 兼容接口）
  # 以下是常用 LLM 的配置示例，取消注释并配置 API Key 即可使用
  llm:
    # ==================== 通义千问（默认） ====================
#    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#    api-key: ${REBUILD_LLM_API_KEY:}
#    model-name: qwen-plus

    # ==================== DeepSeek ====================
    base-url: https://api.deepseek.com/v1
    api-key: ${REBUILD_LLM_API_KEY:sk-0fc0b2720c40490eba322c9ac2079afb}
    model-name: deepseek-v4-flash

    # ==================== Claude（Anthropic） ====================
    # base-url: https://api.anthropic.com/v1
    # api-key: ${REBUILD_LLM_API_KEY:}
    # model-name: claude-3-sonnet-20240229

    # ==================== OpenAI ====================
    # base-url: https://api.openai.com/v1
    # api-key: ${REBUILD_LLM_API_KEY:}
    # model-name: gpt-4o

    # ==================== Ollama（本地部署） ====================
    # base-url: http://localhost:11434/v1
    # api-key: ollama
    # model-name: llama3.3:70b

    temperature: 0.3
    max-tokens: 4096

  # Neo4j 嵌入式数据存储目录
  graph:
    neo4j:
      data-path: ./neo4j-data

  # 构建工具配置（自动检测 Maven/Gradle）
  build:
    # Maven home 目录，留空则使用系统 PATH 中的 mvn
    maven-home: ${MAVEN_HOME:}
    # Gradle home 目录，留空则使用系统 PATH 中的 gradle
    gradle-home: ${GRADLE_HOME:}
    # JDK home 目录，用于执行 Maven/Gradle 时设置 JAVA_HOME
    jdk-home: ${JAVA_HOME:}
    # 测试超时时间（毫秒），默认 10 分钟
    timeout-ms: 600000

  # 重构执行器配置
  executor:
    # 最大连续失败重试次数，超过则生成人工介入报告
    max-retries: 3
    # 验证模式：test（全量测试）/ compile（仅编译）/ skip（跳过验证）
    test-mode: test

  # 报告输出目录
  report:
    output-dir: ./rebuild-reports

# 日志配置
logging:
  level:
    root: INFO
    com.rebuild.agent: DEBUG
    org.neo4j: WARN
    org.springframework: WARN
